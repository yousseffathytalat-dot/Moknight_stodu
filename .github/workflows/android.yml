name: Android Build

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip the project
        run: |
          mkdir -p proj
          unzip -q -o "$(ls *.zip | head -n 1)" -d proj
          ls proj

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android NDK and CMake
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Download llama.cpp source from GitHub
        working-directory: proj/MoKnight-Studio-Phase1
        run: bash scripts/fetch-llama-cpp.sh

      - name: Build Android APK
        working-directory: proj/MoKnight-Studio-Phase1
        run: gradle --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: moknight-studio-debug-apk
          path: proj/MoKnight-Studio-Phase1/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
